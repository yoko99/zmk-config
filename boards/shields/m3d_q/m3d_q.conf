# ----------------
# Power Management
# ----------------
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000        # 30秒でアイドル検知
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000 # 600秒（10分）でスリープ
CONFIG_ZMK_EXT_POWER=n               # 外部電源制御を無効化（rgb_underglowのビルドエラー回避）

# ----------------
# Bluetooth
# ----------------
CONFIG_ZMK_BLE=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40

# ----------------
# RGB Underglow (左側のみ)
# ----------------
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y  # アイドル時に自動オフ

# ----------------
# Keyboard Scan
# ----------------
CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=4

# ----------------
# System
# ----------------
CONFIG_ZMK_KEYBOARD_NAME="m3d_q"
CONFIG_HEAP_MEM_POOL_SIZE=4096

# ----------------
# Nordic SDK 最新設定
# ----------------
CONFIG_NRF_RESET_REASON=y
